# cli-standards: CLI-QUALITY-001, CLI-QUALITY-002
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errorlint
    - misspell
    - revive
  settings:
    misspell:
      locale: US
      ignore-rules:
        - cancelled
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
