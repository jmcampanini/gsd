min_version = "2026.9.18"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "macos-arm64"]

[tools]
go = "1.27.3"
golangci-lint = "2.14.0"
goreleaser = "2.19.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
# tmux drives the end-to-end tests. Pinning it here gives local and CI runs the same tmux; users of the built binary do not need it.
tmux = "3.7c"
# node hosts markdownlint-cli2, which lints the tracked Markdown with the shared rules in .markdownlint-cli2.jsonc.
node = "24.21.0"
"npm:markdownlint-cli2" = "0.24.0"

[env]
# Go's default GOTOOLCHAIN=auto lets it download and run whatever toolchain go.mod asks for. local pins execution to the Go that mise installed, so mise.toml is the only place the toolchain version is decided.
GOTOOLCHAIN = "local"

[tasks.build]
description = "Build build/gsd with git-derived version metadata."
run = '''
version="$(git describe --tags --dirty --always 2>/dev/null || printf 'unknown')"
mkdir -p build
go build -trimpath -buildvcs=false -ldflags "-X github.com/jmcampanini/gsd/internal/cli.Version=${version}" -o build/gsd .
'''

# The end-to-end suite drives build/gsd, so test depends on build and tells the suite where the binary is. Within one mise run, build runs once for both test and version-check.
[tasks.test]
description = "Run all tests uncached with the race detector."
depends = ["build"]
env = { GSD_E2E_BINARY = "{{config_root}}/build/gsd" }
run = "go test -count=1 -race ./..."

[tasks.lint]
description = "Run static analysis."
run = "golangci-lint run ./..."

[tasks.lint-fix]
description = "Run static analysis with --fix."
run = "golangci-lint run --fix ./..."

[tasks.lint-markdown]
description = "Lint tracked Markdown using the shared Markdown rules."
run = "git ls-files -z -- '*.md' '*.markdown' | xargs -0 markdownlint-cli2"

[tasks.fmt]
description = "Format Go source files."
run = "golangci-lint fmt"

[tasks.fmt-check]
description = "Verify formatting without changing files."
run = "golangci-lint fmt --diff"

[tasks.tidy]
description = "Apply go mod tidy."
run = "go mod tidy"

[tasks.tidy-check]
description = "Verify go.mod and go.sum are tidy without changing them."
run = "go mod tidy -diff"

[tasks.version-check]
description = "Verify the built binary reports the injected version."
depends = ["build"]
run = '''
version="$(git describe --tags --dirty --always 2>/dev/null || printf 'unknown')"
case "$version" in
  unknown|n/a|"") echo "degenerate version identity: '$version'"; exit 1;;
esac
out="$(build/gsd --version)"
if [ "$out" != "gsd version $version" ]; then
  echo "version mismatch: got '$out', want 'gsd version $version'"
  exit 1
fi
'''

[tasks.vuln]
description = "Check dependencies and reachable code for known vulnerabilities."
run = "govulncheck ./..."

# check is read-only: it must leave the tracked tree unchanged and create nothing outside ignored paths. CI asserts a clean checkout before and after it runs. Add report-only tasks here; fixers (fmt, lint-fix, tidy) stay out.
[tasks.check]
description = "Run the complete local verification contract."
depends = ["fmt-check", "tidy-check", "lint", "lint-markdown", "test", "version-check", "vuln", "release-snapshot"]

[tasks.release-snapshot]
description = "Validate and build release archives into dist/ without publishing."
run = [
  "goreleaser check",
  "goreleaser release --snapshot --clean",
]

[tasks.release]
description = "Build and publish the checked-out tag (release workflow only)."
run = """
if [ "${GITHUB_ACTIONS:-}" != "true" ] || [ "${GITHUB_WORKFLOW:-}" != "release" ] || [ "${GITHUB_EVENT_NAME:-}" != "push" ] || [ "${GITHUB_REF_TYPE:-}" != "tag" ]; then
  echo "release publishes artifacts and runs only from the release workflow on a tag; use 'mise run release-snapshot' locally"
  exit 1
fi
goreleaser release --clean
"""

[tasks.clean]
description = "Remove build artifacts and the Go test cache."
run = [
  "rm -rf build dist",
  "go clean -testcache",
]
